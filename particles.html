<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Particle Field</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #020818;
        --toggle-bg: rgba(255, 255, 255, 0.06);
        --toggle-bg-hover: rgba(255, 255, 255, 0.12);
        --toggle-border: rgba(255, 255, 255, 0.18);
        --toggle-fg: #e8ecff;
        --focus-ring: #7aa2ff;
        --header-bg: #0b1330;
        --header-border: rgba(122, 162, 255, 0.35);
        --header-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
        --header-fg: #ff6b6b;
      }
      :root[data-theme='light'] {
        --bg: #f3f5fb;
        --toggle-bg: rgba(2, 8, 24, 0.05);
        --toggle-bg-hover: rgba(2, 8, 24, 0.1);
        --toggle-border: rgba(2, 8, 24, 0.18);
        --toggle-fg: #1a2340;
        --focus-ring: #2f5bd8;
        --header-bg: #ffffff;
        --header-border: rgba(47, 91, 216, 0.35);
        --header-shadow: 0 4px 14px rgba(26, 35, 64, 0.12);
        --header-fg: #c62828;
      }
      body {
        background: var(--bg);
        overflow: hidden;
        cursor: none;
        transition: background-color 0.4s ease;
      }
      canvas {
        display: block;
      }
      #app-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 72px;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--header-bg);
        border-bottom: 2px solid var(--header-border);
        box-shadow: var(--header-shadow);
        transition:
          background-color 0.4s ease,
          border-color 0.4s ease;
      }
      #ui {
        color: var(--header-fg);
        font: 13px/1.6 monospace;
        text-align: center;
        pointer-events: none;
        letter-spacing: 0.1em;
        padding: 0 72px;
      }
      #cursor {
        position: fixed;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: white;
        mix-blend-mode: difference;
        transform: translate(-50%, -50%);
        pointer-events: none;
        transition: transform 0.1s ease;
      }

      /* Theme toggle */
      #theme-toggle {
        position: fixed;
        top: 14px;
        right: 16px;
        z-index: 10;
        width: 44px;
        height: 44px;
        padding: 0;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 1px solid var(--toggle-border);
        background: var(--toggle-bg);
        color: var(--toggle-fg);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        cursor: pointer;
        transition:
          background-color 0.3s ease,
          border-color 0.3s ease,
          color 0.3s ease,
          transform 0.2s ease;
      }
      #theme-toggle:hover {
        background: var(--toggle-bg-hover);
        transform: scale(1.06);
      }
      #theme-toggle:active {
        transform: scale(0.94);
      }
      #theme-toggle:focus {
        outline: none;
      }
      #theme-toggle:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 3px;
      }
      #theme-toggle svg {
        grid-area: 1 / 1;
        width: 20px;
        height: 20px;
        transition:
          transform 0.5s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.35s ease;
      }
      /* Dark theme: show moon; light theme: show sun */
      #theme-toggle .icon-sun {
        opacity: 0;
        transform: rotate(-90deg) scale(0.4);
      }
      #theme-toggle .icon-moon {
        opacity: 1;
        transform: rotate(0) scale(1);
      }
      :root[data-theme='light'] #theme-toggle .icon-sun {
        opacity: 1;
        transform: rotate(0) scale(1);
      }
      :root[data-theme='light'] #theme-toggle .icon-moon {
        opacity: 0;
        transform: rotate(90deg) scale(0.4);
      }
      /* Show the real pointer over the button (custom cursor hidden there) */
      body.over-toggle #cursor {
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        body,
        #app-header,
        #theme-toggle,
        #theme-toggle svg {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="cursor"></div>
    <header id="app-header">
      <div id="ui">move mouse · click to explode · scroll to change gravity</div>
    </header>
    <button
      id="theme-toggle"
      type="button"
      aria-label="Switch to light theme"
      aria-pressed="false"
      title="Switch to light theme"
    >
      <svg
        class="icon-moon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
      <svg
        class="icon-sun"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
        />
      </svg>
    </button>
    <script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const cursor = document.getElementById('cursor');
      const themeToggle = document.getElementById('theme-toggle');

      // ---- Theme ----
      const THEMES = {
        dark: {
          trail: 'rgba(2,8,24,0.18)',
          glow: 'rgba(255,255,255,0.08)',
          ripple: '255,255,255',
          light: [50, 3],
        },
        light: {
          trail: 'rgba(243,245,251,0.18)',
          glow: 'rgba(2,8,24,0.06)',
          ripple: '2,8,24',
          light: [42, 1.5],
        },
      };
      let theme = 'dark';
      try {
        if (localStorage.getItem('theme') === 'light') theme = 'light';
      } catch {
        // storage unavailable (e.g. private mode); keep the default
      }

      function applyTheme(name) {
        theme = name;
        document.documentElement.dataset.theme = name;
        const next = name === 'dark' ? 'light' : 'dark';
        themeToggle.setAttribute('aria-label', `Switch to ${next} theme`);
        themeToggle.title = `Switch to ${next} theme`;
        themeToggle.setAttribute('aria-pressed', String(name === 'light'));
        try {
          localStorage.setItem('theme', name);
        } catch {
          // storage unavailable; the theme still applies for this session
        }
      }
      applyTheme(theme);

      themeToggle.addEventListener('click', (e) => {
        e.stopPropagation(); // don't trigger the canvas explosion
        applyTheme(theme === 'dark' ? 'light' : 'dark');
      });
      themeToggle.addEventListener('mouseenter', () => document.body.classList.add('over-toggle'));
      themeToggle.addEventListener('mouseleave', () =>
        document.body.classList.remove('over-toggle'),
      );

      let W, H;
      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const PARTICLE_COUNT = 600;
      const GRAVITY = 0.6;
      const DAMPING = 0.97;
      const MAX_SPEED = 12;

      const mouse = { x: W / 2, y: H / 2, down: false };
      let gravityStrength = GRAVITY;

      class Particle {
        constructor() {
          this.reset(true);
        }

        reset(initial = false) {
          this.x = initial ? Math.random() * W : W / 2 + (Math.random() - 0.5) * 200;
          this.y = initial ? Math.random() * H : H / 2 + (Math.random() - 0.5) * 200;
          this.vx = (Math.random() - 0.5) * 4;
          this.vy = (Math.random() - 0.5) * 4;
          this.radius = Math.random() * 1.8 + 0.4;
          this.hue = Math.random() * 360;
          this.life = 1;
        }

        update() {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;

          // Gravity pull toward mouse
          const force = (gravityStrength * 1200) / (dist * dist + 80);
          this.vx += (dx / dist) * force;
          this.vy += (dy / dist) * force;

          // Repulse when very close
          if (dist < 60) {
            const repel = ((60 - dist) / 60) * 3;
            this.vx -= (dx / dist) * repel;
            this.vy -= (dy / dist) * repel;
          }

          // Speed cap
          const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          if (speed > MAX_SPEED) {
            this.vx = (this.vx / speed) * MAX_SPEED;
            this.vy = (this.vy / speed) * MAX_SPEED;
          }

          this.vx *= DAMPING;
          this.vy *= DAMPING;
          this.x += this.vx;
          this.y += this.vy;

          // Hue shifts with velocity
          this.hue = (this.hue + speed * 0.5) % 360;

          // Wrap edges
          if (this.x < -20) this.x = W + 20;
          if (this.x > W + 20) this.x = -20;
          if (this.y < -20) this.y = H + 20;
          if (this.y > H + 20) this.y = -20;
        }

        draw() {
          const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          const [baseL, speedL] = THEMES[theme].light;
          const brightness = Math.min(baseL + speed * speedL, 90);
          const alpha = 0.6 + Math.min(speed * 0.04, 0.4);
          const r = this.radius + speed * 0.15;

          ctx.beginPath();
          ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${this.hue},90%,${brightness}%,${alpha})`;
          ctx.fill();
        }
      }

      const particles = Array.from({ length: PARTICLE_COUNT }, () => new Particle());

      // Ripple rings on click
      let ripples = [];
      function addRipple(x, y) {
        ripples.push({ x, y, r: 0, maxR: 160, alpha: 1 });
      }

      function explode() {
        particles.forEach((p) => {
          const dx = p.x - mouse.x;
          const dy = p.y - mouse.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const power = Math.max(0, (200 - dist) / 200) * 18;
          p.vx += (dx / dist) * power;
          p.vy += (dy / dist) * power;
        });
        addRipple(mouse.x, mouse.y);
      }

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });

      window.addEventListener('click', explode);

      window.addEventListener(
        'wheel',
        (e) => {
          gravityStrength = Math.max(0.05, Math.min(3, gravityStrength - e.deltaY * 0.001));
        },
        { passive: true },
      );

      function draw() {
        // Fade trail
        const t = THEMES[theme];
        ctx.fillStyle = t.trail;
        ctx.fillRect(0, 0, W, H);

        // Ripples
        ripples = ripples.filter((rp) => rp.alpha > 0.01);
        ripples.forEach((rp) => {
          rp.r += 4;
          rp.alpha *= 0.93;
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(${t.ripple},${rp.alpha})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        });

        // Mouse glow
        const grd = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 80);
        grd.addColorStop(0, t.glow);
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grd;
        ctx.fillRect(mouse.x - 80, mouse.y - 80, 160, 160);

        particles.forEach((p) => {
          p.update();
          p.draw();
        });

        requestAnimationFrame(draw);
      }

      requestAnimationFrame(draw);
    </script>
  </body>
</html>
